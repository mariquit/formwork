[package]
name = "formwork"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Formwork: multi-agent delivery for solo development"
authors = ["John Anthony Mariquit <john@mariquit.com>"]
license = "Apache-2.0"
readme = "../../README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
json5 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
